<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>教學駕駛艙總覽</title>
  <style>
    :root {
      --board: #173d32;
      --chalk: #f2efdc;
      --muted: #cfdcc4;
      --yellow: #f5d260;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--chalk);
      font-family: "Microsoft JhengHei", "Noto Sans TC", system-ui, sans-serif;
      background:
        linear-gradient(rgba(255,255,255,.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px),
        var(--board);
      background-size: 42px 42px;
    }
    main {
      max-width: 980px;
      margin: 0 auto;
      padding: 48px 24px;
    }
    h1 {
      margin: 0 0 12px;
      font-size: clamp(34px, 6vw, 64px);
      letter-spacing: 0;
    }
    p {
      color: var(--muted);
      font-size: 20px;
      line-height: 1.6;
    }
    .list {
      display: grid;
      gap: 14px;
      margin-top: 32px;
    }
    a {
      display: block;
      padding: 18px 20px;
      color: var(--yellow);
      text-decoration: none;
      border: 1px solid rgba(245, 210, 96, .48);
      background: rgba(0,0,0,.14);
      border-radius: 6px;
      font-size: 24px;
    }
    a span {
      display: block;
      margin-top: 6px;
      color: var(--muted);
      font-size: 15px;
    }
  </style>
</head>
<body>
  <main>
    <h1>教學駕駛艙總覽</h1>
    <p>這個倉庫統一管理各單元的教學駕駛艙。影片採外部雲端連結，GitHub 只保存靜態網頁與圖片素材。</p>
    <section class="list" aria-label="教學駕駛艙清單">
      <a href="./chinese-dance-dashboard-20260501/">
        第10課｜中國舞蹈大觀園
        <span>黑板粉筆風格教學駕駛艙</span>
      </a>
    </section>
  </main>
</body>
</html>
